AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Carbon Scheduler - Router Lambda

Resources:
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carbon-router
      Handler: app.lambda_handler
      Runtime: python3.11
      MemorySize: 128
      Timeout: 30
      CodeUri: .
      Role: arn:aws:iam::714437051269:role/carbon-router-role
      
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
            - x-secret-token
            - authorization
          MaxAge: 300
      Environment:
        Variables:
          SECRET_TOKEN: "scheduler-secret-2024"
          WORKER_ARNS: '{"ap-south-1":"arn:aws:lambda:ap-south-1:714437051269:function:carbon-worker","eu-north-1":"arn:aws:lambda:eu-north-1:714437051269:function:carbon-worker","us-east-1":"arn:aws:lambda:us-east-1:714437051269:function:carbon-worker"}'

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/carbon-router
      RetentionInDays: 1

Outputs:
  RouterFunctionUrl:
    Description: Router Function URL
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  RouterFunctionArn:
    Description: Router Function ARN
    Value: !GetAtt RouterFunction.Arn
