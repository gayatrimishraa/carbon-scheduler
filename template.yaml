AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Carbon-Aware Serverless Scheduler — unified stack

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 128
    Timeout: 30
    Architectures: [x86_64]
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_REGION: ap-south-1

Resources:
  # ─────────────────────────────────────────
  # COLLECTOR
  # ─────────────────────────────────────────
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/carbon-collector
      RetentionInDays: 1

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carbon-collector
      Handler: app.lambda_handler
      CodeUri: collector/
      Environment:
        Variables:
          TABLE_NAME: carbon_live
          SSM_PARAM: /carbon-scheduler/live-mode
      Events:
        HourlyTrigger:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: carbon-collector-hourly
            Enabled: true
      Policies:
        - DynamoDBWritePolicy:
            TableName: carbon_live
        - SSMParameterReadPolicy:
            ParameterName: carbon-scheduler/live-mode

  # ─────────────────────────────────────────
  # ROUTER
  # ─────────────────────────────────────────
  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/carbon-router
      RetentionInDays: 1

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carbon-router
      Handler: app.lambda_handler
      CodeUri: router/
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders:
            - content-type
            - x-secret-token
            - x-scheduler-token
            - authorization
          MaxAge: 300
      Environment:
        Variables:
          SECRET_TOKEN: "scheduler-secret-2024"
          WORKER_ARNS: '{"ap-south-1":"arn:aws:lambda:ap-south-1:714437051269:function:carbon-worker","eu-north-1":"arn:aws:lambda:eu-north-1:714437051269:function:carbon-worker","us-east-1":"arn:aws:lambda:us-east-1:714437051269:function:carbon-worker"}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: carbon_live
        - DynamoDBReadPolicy:
            TableName: region_state
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - arn:aws:lambda:ap-south-1:714437051269:function:carbon-worker
                - arn:aws:lambda:eu-north-1:714437051269:function:carbon-worker
                - arn:aws:lambda:us-east-1:714437051269:function:carbon-worker

  # ─────────────────────────────────────────
  # WORKER (ap-south-1 only)
  # ─────────────────────────────────────────
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/carbon-worker
      RetentionInDays: 1

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carbon-worker
      Handler: app.lambda_handler
      CodeUri: worker/
      Environment:
        Variables:
          PLACEHOLDER: "1"

  # ─────────────────────────────────────────
  # ML FORECAST
  # ─────────────────────────────────────────
  MLLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/carbon-ml-forecast
      RetentionInDays: 1

  MLForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: carbon-ml-forecast
      Handler: predict.lambda_handler
      CodeUri: ml/
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          CARBON_TABLE: carbon_live
          FORECAST_TABLE: region_state
          DYNAMODB_REGION: ap-south-1
      Events:
        HourlyForecast:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: carbon-ml-forecast-hourly
            Enabled: true
      Policies:
        - DynamoDBReadPolicy:
            TableName: carbon_live
        - DynamoDBWritePolicy:
            TableName: region_state

  # ─────────────────────────────────────────
  # CLOUDWATCH DASHBOARD  ← FIXED: now under Resources
  # ─────────────────────────────────────────
  SchedulerDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: CarbonAwareScheduler
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": {
                "markdown": "# 🌱 Carbon-Aware Serverless Scheduler — Live Dashboard"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Router Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-router", {"stat": "Sum", "period": 3600}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Router Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "carbon-router", {"stat": "Sum", "period": 3600, "color": "#d62728"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 1, "width": 8, "height": 6,
              "properties": {
                "title": "Router Duration (ms)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "carbon-router", {"stat": "p99", "period": 3600, "label": "p99"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "carbon-router", {"stat": "Average", "period": 3600, "label": "avg"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "Worker Invocations by Region",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-worker", {"stat": "Sum", "period": 3600, "region": "ap-south-1", "label": "Mumbai"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-worker", {"stat": "Sum", "period": 3600, "region": "us-east-1", "label": "N. Virginia"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-worker", {"stat": "Sum", "period": 3600, "region": "eu-north-1", "label": "Stockholm"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "ML Forecast Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-ml-forecast", {"stat": "Sum", "period": 3600}],
                  ["AWS/Lambda", "Errors", "FunctionName", "carbon-ml-forecast", {"stat": "Sum", "period": 3600, "color": "#d62728"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 7, "width": 8, "height": 6,
              "properties": {
                "title": "Collector Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "carbon-collector", {"stat": "Sum", "period": 3600}],
                  ["AWS/Lambda", "Errors", "FunctionName", "carbon-collector", {"stat": "Sum", "period": 3600, "color": "#d62728"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Cold Starts Across All Functions",
                "metrics": [
                  ["AWS/Lambda", "InitDuration", "FunctionName", "carbon-router", {"stat": "Sum", "period": 3600, "label": "Router"}],
                  ["AWS/Lambda", "InitDuration", "FunctionName", "carbon-ml-forecast", {"stat": "Sum", "period": 3600, "label": "ML Forecast"}],
                  ["AWS/Lambda", "InitDuration", "FunctionName", "carbon-collector", {"stat": "Sum", "period": 3600, "label": "Collector"}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 13, "width": 12, "height": 6,
              "properties": {
                "title": "Concurrent Executions",
                "metrics": [
                  ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "carbon-router", {"stat": "Maximum", "period": 3600}],
                  ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "carbon-worker", {"stat": "Maximum", "period": 3600}]
                ],
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 3600
              }
            }
          ]
        }

Outputs:
  RouterFunctionUrl:
    Description: Router Function URL
    Value: !GetAtt RouterFunction.Arn
  RouterFunctionArn:
    Description: Router Function ARN
    Value: !GetAtt RouterFunction.Arn
  MLForecastFunctionArn:
    Description: ML Forecast Lambda ARN
    Value: !GetAtt MLForecastFunction.Arn
  WorkerFunctionArn:
    Description: Worker Function ARN
    Value: !GetAtt WorkerFunction.Arn
